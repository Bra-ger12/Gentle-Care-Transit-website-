<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audit log — Gentle Care Transit</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
</head>
<body>
  <nav id="app-nav"></nav>
  <main>
    <div class="portal-page">
      <h1>Audit log</h1>
      <p><a href="/admin/reports.html">&larr; KPI dashboard</a></p>

      <form class="date-range-form" id="filter-form">
        <label>
          Action
          <select id="action">
            <option value="">All</option>
            <option value="VIEW">VIEW</option>
            <option value="CREATE">CREATE</option>
            <option value="UPDATE">UPDATE</option>
            <option value="DELETE">DELETE</option>
            <option value="EXPORT">EXPORT</option>
          </select>
        </label>
        <label>
          Model name
          <input type="text" id="model_name" placeholder="e.g. Invoice" />
        </label>
      </form>

      <div id="content">
        <div class="page-status">Loading session...</div>
      </div>
    </div>
  </main>
  <script type="module" src="/js/pages/admin/audit-log.js"></script>
</body>
</html>
