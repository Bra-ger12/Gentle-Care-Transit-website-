<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accounts — Gentle Care Transit</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
</head>
<body>
  <nav id="app-nav"></nav>
  <main>
    <div class="portal-page">
      <h1>Manage accounts</h1>
      <p class="page-status-note">Patient and driver accounts. Suspending an account blocks sign-in until it is reactivated.</p>

      <form class="date-range-form" id="filter-form">
        <label>Role
          <select id="role-filter">
            <option value="">All</option>
            <option value="RIDER">Patients</option>
            <option value="DRIVER">Drivers</option>
          </select>
        </label>
        <label>Search <input type="search" id="q" placeholder="name or email" /></label>
        <button type="submit" class="btn btn--primary">Apply</button>
      </form>

      <div id="content">
        <div class="page-status">Loading session...</div>
      </div>
    </div>
  </main>
  <script type="module" src="/js/pages/admin/accounts.js"></script>
</body>
</html>
