<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account under review — Gentle Care Transit</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
</head>
<body>
  <header class="public-header">
    <span class="brand">
      <span class="logo-mark"><img src="/assets/logo-mark.png" alt="" width="20" height="20" /></span>
      <span class="brand__text">
        <span class="brand__name">Gentle Care Transit</span>
        <span class="brand__subtitle">NORTH DAKOTA NEMT</span>
      </span>
    </span>
  </header>
  <main>
    <div class="notice-page">
      <h1>Your driver account is under review</h1>
      <p class="page-status-note">
        We're verifying your license and vehicle documents. This usually takes 1–2 business days —
        you'll be able to accept trips as soon as an administrator approves your account.
      </p>
      <div id="checklist"></div>
      <div class="pending-actions">
        <a class="btn btn--primary" href="/account.html">Your license &amp; vehicle details</a>
        <button class="btn" id="logout-btn">Log out</button>
      </div>
    </div>
  </main>
  <script type="module" src="/js/pages/driver-pending.js"></script>
</body>
</html>
